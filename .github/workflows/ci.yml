name: Build and Deploy

on:
  push:
    branches: [production]
jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
      - name: Restart PM2
        run: pm2 restart tacra-social-hub --update-env
